<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random URL Jumper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 270px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      color: #333;
      background-color: #fafafa;
      user-select: none;
    }
    /* 📌 팝아웃 미니 윈도우 모드 시 화면 전체 채우기 */
    body.is-popout {
      width: 100vw;
      min-height: 100vh;
      background-color: #ffffff;
      padding: 16px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #e0e0e0;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #202124;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .badge.idle {
      background-color: #e8eaed;
      color: #5f6368;
    }
    .badge.running {
      background-color: #e6f4ea;
      color: #137333;
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .icon-btn {
      background: none;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 2px 5px;
      cursor: pointer;
      font-size: 12px;
      color: #5f6368;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, border-color 0.15s;
    }
    .icon-btn:hover {
      background-color: #f1f3f4;
      border-color: #c6c9cc;
      color: #202124;
    }
    /* 현재 활성 탭 안내 바 */
    .tab-bar {
      font-size: 11px;
      color: #5f6368;
      background: #f1f3f4;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-bar strong {
      color: #1a73e8;
    }
    .field-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      color: #5f6368;
    }
    select {
      width: 100%;
      padding: 7px 8px;
      font-size: 13px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background-color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus {
      border-color: #1a73e8;
    }

    /* ⏱️ 카운트다운 카드 스타일 */
    .countdown-card {
      background: linear-gradient(135deg, #e8f0fe 0%, #f1f6fd 100%);
      border: 1px solid #c2e7ff;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(66, 133, 244, 0.08);
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .countdown-header {
      font-size: 11px;
      color: #1967d2;
      font-weight: 500;
      margin-bottom: 3px;
    }
    .countdown-display {
      font-size: 24px;
      font-weight: 700;
      color: #1a73e8;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
    }
    .countdown-display .unit {
      font-size: 13px;
      font-weight: 500;
      color: #5f6368;
    }
    .countdown-bar-bg {
      width: 100%;
      height: 4px;
      background-color: #d2e3fc;
      border-radius: 2px;
      margin-top: 6px;
      overflow: hidden;
    }
    .countdown-bar-fill {
      height: 100%;
      width: 100%;
      background-color: #1a73e8;
      border-radius: 2px;
      transition: width 0.15s linear;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-top: 4px;
    }
    .row {
      display: flex;
      gap: 7px;
    }
    button {
      flex: 1;
      padding: 8px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #dadce0;
      border-radius: 6px;
      background-color: #fff;
      color: #3c4043;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s, opacity 0.15s;
    }
    button:hover:not(:disabled) {
      background-color: #f1f3f4;
      border-color: #c6c9cc;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button.primary {
      background-color: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }
    button.primary:hover:not(:disabled) {
      background-color: #1557b0;
      border-color: #1557b0;
    }
    button.danger {
      background-color: #ea4335;
      color: #fff;
      border-color: #ea4335;
    }
    button.danger:hover:not(:disabled) {
      background-color: #d93025;
      border-color: #d93025;
    }
    .footer {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }
    .link-btn {
      background: none;
      border: none;
      padding: 2px;
      color: #1a73e8;
      cursor: pointer;
      font-size: 11px;
    }
    .link-btn:hover {
      text-decoration: underline;
    }
    .link-btn.danger-text {
      color: #d93025;
    }
    .multi-status-text {
      color: #70757a;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Random Jumper</h1>
    <div class="header-actions">
      <span id="statusBadge" class="badge idle">정지됨</span>
      <button id="popoutBtn" class="icon-btn" title="사라지지 않는 미니 창으로 분리 (고정)">📌</button>
    </div>
  </div>

  <!-- 현재 활성 탭 표시 -->
  <div class="tab-bar" title="현재 포커스된 웹페이지 탭">
    대상 탭: <strong id="currentTabLabel">탐색 중...</strong>
  </div>

  <div class="field-group">
    <label for="profile">이 탭에 적용할 프로필</label>
    <select id="profile"></select>
  </div>

  <!-- ⏱️ 카운트다운 표시 카드 -->
  <div id="countdownCard" class="countdown-card" style="display: none;">
    <div class="countdown-header">이 탭의 다음 점프까지</div>
    <div class="countdown-display">
      <span id="countdownNumber">10</span>
      <span class="unit">초</span>
    </div>
    <div class="countdown-bar-bg">
      <div id="countdownProgressBar" class="countdown-bar-fill"></div>
    </div>
  </div>

  <div class="btn-group">
    <div class="row">
      <button id="start" class="primary">이 탭 시작</button>
      <button id="stop" class="danger" disabled>이 탭 정지</button>
    </div>
    <button id="jump">이 탭 즉시 이동 (Ctrl+Shift+Y)</button>
  </div>

  <div class="footer">
    <span id="multiTabStatus" class="multi-status-text"></span>
    <div>
      <button id="stopAllBtn" class="link-btn danger-text" style="display: none; margin-right: 6px;">전체 정지</button>
      <button id="settings" class="link-btn">⚙️ 설정</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
